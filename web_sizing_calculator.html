/* ============================================================
   拟合：log-log 二次 + 端点外推保护
   ============================================================ */
function pavaNonIncreasing(vals){
  // 保序回归：在保持非增趋势下最小化平方误差
  const blocks=[];
  for(let i=0;i<vals.length;i++) blocks.push({v:vals[i], w:1});
  let j=0;
  while(j < blocks.length-1){
    if(blocks[j].v < blocks[j+1].v){          // 出现上升 → 违反非增
      const a=blocks[j], b=blocks[j+1];
      blocks.splice(j, 2, {v:(a.v*a.w+b.v*b.w)/(a.w+b.w), w:a.w+b.w});
      if(j>0) j--;
    } else j++;
  }
  const out=[];
  for(const b of blocks) for(let k=0;k<b.w;k++) out.push(b.v);
  return out;
}

function fitCurve(pts){
  const clean = pts.filter(p=>p[0]>0 && p[1]>0).slice().sort((a,b)=>a[0]-b[0]);
  const n = clean.length;
  if(n < 4) return {ok:false, n, msg:"样本不足（<4 点）"};
  // log-log 空间的分段插值：曲线严格穿过每个样本点
  const xs = clean.map(p=>Math.log10(p[0]));
  // 原始数据非单调（不同机型设计差异大），插值会产生多个自洽解
  // 用保序回归强制非增，消除多解
  const ysRaw = clean.map(p=>Math.log10(p[1]));
  const ys = ysRaw;   // 保留穿点精度（非单调，需配合多解处理）
  return {
    ok:true, n, r2:1.0, interp:true,
    xmin:xs[0], xmax:xs[n-1],
    predict(w){
      const x = Math.log10(Math.max(w,1e-6));
      let y;
      if(x <= xs[0]){                       // 左端外推：用首段斜率
        const k=(ys[1]-ys[0])/(xs[1]-xs[0]||1e-9);
        y = ys[0] + k*(x-xs[0]);
      } else if(x >= xs[n-1]){              // 右端外推：用末段斜率
        const k=(ys[n-1]-ys[n-2])/(xs[n-1]-xs[n-2]||1e-9);
        y = ys[n-1] + k*(x-xs[n-1]);
      } else {
        let lo=0, hi=n-1;                   // 二分找区间
        while(hi-lo>1){ const mid=(lo+hi)>>1; if(xs[mid]<=x) lo=mid; else hi=mid; }
        const t=(x-xs[lo])/((xs[hi]-xs[lo])||1e-9);
        y = ys[lo] + t*(ys[hi]-ys[lo]);
      }
      return {v:Math.pow(10,y), extrap:(x<xs[0]-1e-9||x>xs[n-1]+1e-9)};
    }
  };
}

  if(S.layout !== "normal") return S.layout;
  return (S.category === "uav") ? "normal_small_uav" : "normal_manned";
}
function P(v,sym,name,unit,src,zh,symF,deps,note){
  return {v,sym,name,unit,src,zh:zh||"",symF:symF||"",deps:deps||[],note:note||""};
}

/* ============================================================
   计算引擎
   ============================================================ */
/* 电池包换算：电压 V × 容量 Ah → Wh、Wh/kg；连续电流 A 或倍率 C → 比功率 */
function batteryFromPack(pv, ah, m, a, c){
  const v=Number(pv), cap=Number(ah), mass=Number(m);
  const curA=(a===""||a===null||a===undefined)?null:Number(a);
  const curC=(c===""||c===null||c===undefined)?null:Number(c);
  const out={ok:false,msg:""};
  if(!(v>0)||!(cap>0)||!(mass>0)){
    out.msg="标称电压、额定容量、电池包质量都要大于零"; return out;
  }
  if(curA!==null && curC!==null && curA>0 && curC>0){
    out.msg="连续放电电流与连续放电倍率只填一项，避免两套数打架"; return out;
  }
  if(curA!==null && !(curA>0)){ out.msg="放电电流要大于零"; return out; }
  if(curC!==null && !(curC>0)){ out.msg="放电倍率要大于零"; return out; }
  const wh=v*cap, e=wh/mass;
  if(e>500){
    out.e=e; out.wh=wh;
    out.msg=`比能量 ${e.toFixed(0)} Wh/kg 超过 500，先检查容量单位：${cap} Ah 是不是该填 mAh？参数未应用`;
    return out;
  }
  const cur=(curA!==null)?curA:(curC!==null?curC*cap:null);
  out.ok=true; out.wh=wh; out.e=e; out.current=cur;
  if(cur!==null){ out.p=v*cur/mass;
    out.msg=`标称能量 ${wh.toFixed(0)} Wh；比能量 ${e.toFixed(1)} Wh/kg；连续比功率 ${(v*cur/mass).toFixed(0)} W/kg`; }
  else { out.msg=`标称能量 ${wh.toFixed(0)} Wh；比能量 ${e.toFixed(1)} Wh/kg；没填放电能力，比功率仍按参数或库值`; }
  return out;
}

function computeAll(){
  const I=S.input, rho=rhoHW(I.h), P0=DB.power[S.power];
  const V=(I.V||0)/3.6;                             // 巡航速度 km/h → m/s（只此一处换算）
  const Vc=(I.Vc||0);                               // 爬升率输入就是 m/s，不再换算
  const isElec = S.power==="electric";
  const isVTOL = S.config!=="fixedwing";
  const isMulti = S.config==="multirotor";
  const isTilt = S.config==="tiltrotor";
  const fEf=fitCurve(DB.emptyFrac[dbKey()].points);
  const LDf=fitCurve(DB.ld[dbKey()].points);
  const o=S.ov;
  // 电池口径：按参数（比能量/比功率）或按自己的电池包换算，二选一
  const battMode = o.battMode ?? "spec";
  const battInfo = batteryFromPack(o.packV, o.packAh, o.packMass, o.packA, o.packC);
  const battUsable = battMode==="pack" && battInfo.ok;
  const eBatt = battUsable ? battInfo.e : (o.e_batt ?? P0.e_batt);
  const pBatt = (battUsable && isFinite(battInfo.p)) ? battInfo.p : (o.p_batt ?? 1000);
  const DoD = o.DoD ?? 0.85;
  const etaP=o.etaP??0.78, etaT=o.etaT??0.96, FM=o.FM??0.70;
  const AR=o.AR??6.0, reserve=o.reserve??0.20, CLmax=o.CLmax??1.4;
  const NB=o.NB??6, Dr=o.D??0.38, Arot=NB*Math.PI/4*Dr*Dr;
  const kTrans=o.kTrans??1.15, pAux=o.P_aux??40;
  const res={p:{},warn:[],iters:[]};
  const hTrans = isTilt ? (I.hTrans || o.hTrans || 50) : 0;

  // 剖面时间：三种构型共用一套，能量/燃油/界面都读这一份
  const tHov   = isVTOL ? (I.tHover||0)*60 : 0;
  const tTrans = isTilt ? 20 : 0;
  const tClimb = Vc>0 ? Math.max(0, I.h - hTrans)/Vc : 0;
  const tCr    = V>0 ? I.R*1000/V : 0;
  const tMission = tHov + tTrans + tClimb + tCr;

  let Wto=I.WPL/0.45, fE=0.5, LD=13, mB=0, Wf=0, fF=0;
  let Phov=0,Pcl=0,Pcr=0,Ppk=0,Ptrans=0,Ptr=0;

  // 计算给定总重下的各项
  function state(Wt){
    const fe = o.fE ?? Math.min(0.85, Math.max(0.12, fEf.predict(Wt).v));
    // 巡航点不在 L/Dmax 上：设计巡航升阻比取库值 ×0.85（30 t 以下有效，大机已有 bigCorr）
    const ldCruise = o.ldCruise ?? 0.85;
    const ld = o.LD ?? (Math.max(4, LDf.predict(Wt).v) * (Wt < 30000 ? ldCruise : 1));
    const W = Wt*G;
    // 悬停功率：理想诱导功率 ÷ FM（FM 已含诱导+型阻），再除传动效率。
    // 悬停不产生前飞推力，乘推进效率属于重复计入损失。
    const ph = isVTOL ? Math.pow(W,1.5)/Math.sqrt(2*rho*Arot)/FM/etaT : 0;
    const pcr= W*V/(ld*etaP*etaT);
    const pcl_inc = W*Vc/(etaP*etaT);
    const pcl_fwd = pcr + pcl_inc;                    // 机翼模式爬升（固定翼 / 倾转旋翼）
    // 多旋翼竖直爬升用轴向动量理论：T(Vc/2 + √(Vc²/4 + vi²))，vi² = W/(2ρA)
    const pcl_vt  = (isMulti && Vc>0 && ph>0)
      ? W*(Vc/2 + Math.sqrt(Vc*Vc/4 + W/(2*rho*Arot)))/(FM*etaT)
      : ph + pcl_inc;
    const pc = isMulti ? pcl_vt : pcl_fwd;
    const ptr = isVTOL ? ph*kTrans : 0;
    const cases = isMulti ? [ph,pcl_vt,pcr] : (isTilt ? [ph,ptr,pcl_fwd,pcr] : [pcl_fwd,pcr]);
    const ppk= Math.max(...cases.filter(v=>v>0), 0);

    // 剖面：功率×时长=能量，与下面燃油/电池同源
    const segs=[];
    if(isVTOL && ph>0 && tHov>0) segs.push(["悬停",ph,tHov,"起降悬停与进近"]);
    if(isVTOL && ptr>0 && tTrans>0) segs.push(["过渡",ptr,tTrans,`≈${kTrans}×悬停功率`]);
    if(pc>0 && tClimb>0) segs.push(["爬升",pc,tClimb,isMulti?"竖直爬升":"机翼模式爬升"]);
    if(pcr>0 && tCr>0) segs.push(["巡航",pcr,tCr,"重量×速度÷(L/D×效率)"]);
    if(pAux>0 && tMission>0) segs.push(["机载设备",pAux,tMission,"航电/任务载荷常开"]);
    const E_task = segs.reduce((a,s)=>a+s[1]*s[2]/3600, 0);

    let fuel=0, batt=0, ff=0, Et=0, m1=0, m2=0, fsegs=null;
    if(isElec){
      Et = E_task*(1+reserve);
      m1 = Et/(DoD*eBatt);
      m2 = ppk/pBatt;
      batt = Math.max(m1,m2);
    }else{
      const bsfc=(o.bsfc??P0.bsfc)/3.6e6;              // kg/J
      const lnR=(I.R*1000)*G*bsfc/(etaP*ld);
      const ffCruise=1-Math.exp(-lnR);                  // 仅巡航（Breguet）
      // 爬升油耗只计势能项，与已验证的 9 架口径一致
      const fuelClimb = (Wt*G*Vc/(etaP*etaT))*tClimb*bsfc;
      const fuelVTOL  = (ph*tHov + ptr*tTrans)*bsfc;
      const fuelAux   = pAux*tMission*bsfc;
      const fuelDescent = (o.fDescent??0.03)*ffCruise*Wt;
      const fuelTaxi    = (o.fTaxi??0.06)*ffCruise*Wt;
      const reserveHold = W*V/ld * 2700 * bsfc;         // 45 min 盘旋
      const reservePct  = 0.05 * ffCruise * Wt;         // 5% 航程备份
      const reserveFair = Math.max(reserveHold, reservePct);
      const fuelTask0 = ffCruise*Wt + fuelClimb + fuelVTOL + fuelAux
                      + fuelDescent + fuelTaxi + reserveFair;
      const LARGE_T = 30000;
      const bigCorr = Wt > LARGE_T ? Math.pow(LARGE_T/Wt, 0.20) : 1;
      fuel = fuelTask0 * bigCorr;
      ff = fuel/Wt;
      // 燃油剖面：逐项相加等于 fuel
      fsegs=[];
      if(isTilt && ph>0 && ptr>0){
        if(ph*tHov>0) fsegs.push(["悬停", ph*tHov*bsfc]);
        if(ptr*tTrans>0) fsegs.push(["过渡", ptr*tTrans*bsfc]);
      } else if(fuelVTOL>0) fsegs.push(["悬停/过渡", fuelVTOL]);
      if(fuelClimb>0) fsegs.push(["爬升", fuelClimb]);
      fsegs.push(["巡航", ffCruise*Wt]);
      if(fuelAux>0) fsegs.push(["机载设备", fuelAux]);
      if(fuelDescent>0) fsegs.push(["下降", fuelDescent]);
      if(fuelTaxi>0) fsegs.push(["滑行", fuelTaxi]);
      if(reserveFair>0) fsegs.push(["备份", reserveFair]);
      if(bigCorr!==1) fsegs.push([`大机修正 ×${bigCorr.toFixed(2)}`, (bigCorr-1)*fuelTask0]);
    }
    return {fe, ld, ph, pc, pcr, ptr, ppk, fuel, batt, ff, segs, fsegs,
            E_task, Et, m1, m2};
  }
  // 残差：W - (WPL + 空重 + 燃油/电池)
  function resid(Wt){
    const s = state(Wt);
    return Wt - (I.WPL + s.fe*Wt + (isElec ? s.batt : s.fuel));
  }

  // 多根扫描：插值曲线非单调时 resid 可能有多个零点，取载荷分数合理的那个
  const roots = [], brackets = [];
  let prevW = I.WPL*1.02, prevR = resid(prevW);
  for(let W = I.WPL*1.06; W <= I.WPL*60; W *= 1.06){
    const rr = resid(W);
    if(isFinite(rr) && isFinite(prevR) && rr*prevR < 0){
      let a=prevW, b=W;
      for(let k=0;k<70;k++){
        const m=(a+b)/2;
        if(resid(m)*resid(a) <= 0) b=m; else a=m;
      }
      roots.push((a+b)/2); brackets.push([prevW,W]);
    }
    prevW = W; prevR = rr;
  }
  let solved = false;
  if(roots.length === 0){
    res.warn.push("重量闭合无解：在载重的 1–60 倍范围内找不到自洽总重");
    // 兜底点只用于不崩，所有下游结果都标为无效
    let best=I.WPL/0.45, bestv=1e18;
    for(let W=I.WPL*1.1; W<=I.WPL*40; W*=1.03){
      const v=Math.abs(resid(W)); if(v<bestv){bestv=v;best=W;}
    }
    Wto=best;
  } else {
    const valid = roots.filter(w => { const f=I.WPL/w; return f>0.10 && f<0.50; });
    const pool = valid.length ? valid : roots;
    const TARGET = (S.layout==="normal" && S.category==="uav") ? 0.38 : 0.22;
    Wto = pool.reduce((best,w)=>
      Math.abs(I.WPL/w - TARGET) < Math.abs(I.WPL/best - TARGET) ? w : best, pool[0]);
    solved = true;
    if(roots.length > 1){
      const rl = roots.slice(0,5).map(w=>fmt(w,2)).join("、");
      res.warn.push(`发现 ${roots.length} 个闭合解（${rl} kg），这里显示最接近典型载荷分数的那个；`
        + "多解本身说明假设或统计曲线不自洽，别把它当成唯一解");
    }
    // 迭代记录：把二分法真实的区间收缩过程记下来（不是围绕结果编的数字）
    let [a,b] = brackets[roots.indexOf(Wto)] || brackets[0];
    for(let k=0;k<12;k++){
      const m = (a+b)/2, st = state(m);
      res.iters.push({k:k+1, Wto:m, fE:st.fe, LD:st.ld, fuel:st.fuel, mB:st.batt,
                      resid:resid(m), conv:Math.abs(b-a)/2});
      if(resid(m)*resid(a) <= 0) b=m; else a=m;
    }
  }
  const fin = state(Wto);
  fE=fin.fe; LD=fin.ld; Wf=fin.fuel; mB=fin.batt; fF=fin.ff;
  Phov=fin.ph; Pcl=fin.pc; Pcr=fin.pcr; Ppk=fin.ppk; Ptr=fin.ptr;

  const WE=fE*Wto;
  // 翼载没给时按「失速速度 ≈ 0.35V」反推一个量级合理的起点
  const wsDef = V>0 ? Math.min(900, Math.max(15, 0.5*RHO0*Math.pow(0.35*V,2)*CLmax/G)) : 17;
  const WS = o.WS ?? wsDef;
  const Sw = Wto/WS;
  const bs = Math.sqrt(AR*Sw);
  const Vapp = S.opt.Vapp ? S.opt.Vapp/3.6 : V*0.6;   // 输入 km/h → m/s
  const Vstall = Math.sqrt(2*WS*G/(RHO0*CLmax));
  const CLc = 2*(Wto*0.98)*G/(rho*V*V*Sw);            // V 是 m/s
  const CLi = CLc/0.95/0.90;

  const srcF = x => x==="输入"?"input":x==="统计"?"stat":x==="计算"?"calc":"spec";
  res.p = {
    WPL:P(I.WPL,"W_PL","任务载重","kg","input"),
    V:P(V,"V","巡航速度","m/s","input"),
    R:P(I.R,"R","航程","km","input"),
    h:P(I.h,"h","巡航高度","m","input"),
    rho:P(rho,"ρ","空气密度","kg/m³","calc",
      "空气密度 = 海平面密度 × (1 − 2.2557e-5 × 高度)^4.2559",
      "ρ = ρ0·(1 − 2.2557e-5·h)^4.2559",["h"]),
    fE:P(fE,"f_E","空重分数","—","stat",
      "空重分数 = 空重 ÷ 起飞总重。空重含结构、动力、系统、设备，不含燃油/电池与载荷。按幂律拟合得到",
      "f_E = a·W_TO^b（log-log 二次拟合）",["W_TO"],
      DB.emptyFrac[dbKey()].src+`（N=${fEf.n}，插值）`),
    LD:P(LD,"L/D","升阻比","—","stat",
      "升阻比 = 升力 ÷ 阻力，巡航状态。库值是 L/Dmax，实际巡航点取 0.85 倍（30 t 以下）",
      "L/D = a·W_TO^b × 0.85（log-log 二次拟合）",["W_TO"],
      DB.ld[dbKey()].src+`（N=${LDf.n}，插值）`),
    etaP:P(etaP,"η_prop","推进效率","—","spec","螺旋桨把轴功率转成推进功率的效率"),
    etaT:P(etaT,"η_trans","传动效率","—","spec","传动与电调损失"),
    FM:P(FM,"FM","旋翼品质因数","—","stat","理想悬停功率与实际功率之比"),
    bs:P(bs,"BSFC","比油耗","kg/(kW·h)","stat",
      "比油耗 = 每产生 1 kW·h 轴功消耗的燃油质量","BSFC = ṁ_fuel/P",[],
      DB.power[S.power]?.src||""),
    Arot:P(Arot,"A_rotor","总桨盘面积","m²","calc","桨盘面积 = 旋翼数 × π/4 × 桨径²","A = N·π/4·D²",[]),
    NB:P(NB,"N","旋翼数量","个","input"),
    Drot:P(Dr,"D","桨径","m","input"),
    Vc:P(Vc,"V_c",isMulti?"垂直爬升率":"机翼模式爬升率","m/s","input"),
    Phov:P(Phov,"P_hover","悬停功率","W","calc",
      "悬停功率 = 重量^1.5 ÷ √(2×空气密度×桨盘面积) ÷ 品质因数 ÷ 传动效率。FM 已含诱导与型阻，悬停不产生前飞推力，不再乘推进效率",
      "P_hover = W^1.5/√(2ρA)/FM/η_trans",["W_TO","rho","Arot","FM"]),
    Ptrans:P(Ptr,"P_trans","过渡功率","W","calc",
      `倾转过渡段功率 = 过渡系数 × 悬停功率（系数 ${kTrans}，可在效率页覆盖）`,
      "P_trans = k_trans·P_hover",["Phov"]),
    Paux:P(pAux,"P_aux","机载设备功率","W","assume",
      "航电、飞控、任务载荷等常开功率，按全任务时长计入能量/燃油","P_aux = const"),
    Pcl:P(Pcl,"P_climb",isMulti?"垂直爬升功率":"机翼模式爬升功率","W","calc",
      isMulti?"垂直爬升功率 = 悬停功率 + 重量×爬升率÷效率":"机翼模式爬升功率 = 巡航功率 + 重量×爬升率÷效率（倾转旋翼在机翼模式爬升，不做持续竖直爬升）",
      isMulti?"P_climb = P_hover + W·V_c/η":"P_climb = P_cruise + W·V_c/η",["Phov","Pcr","Vc"]),
    Pcr:P(Pcr,"P_cruise","巡航功率","W","calc",
      "巡航功率 = 重量×速度 ÷ (升阻比×推进效率×传动效率)","P_cruise = W·V/((L/D)·η_prop·η_trans)",["W_TO","V","LD"]),
    Ppk:P(Ppk,"P_peak","峰值功率","W","calc",
      "峰值功率 = 各剖面功率的最大值","P_peak = max(P_hover,P_trans,P_climb,P_cruise)",["Phov","Ptrans","Pcl","Pcr"]),
    Etask:P(fin.E_task,"E_task","任务能量","Wh","calc",
      "任务能量 = Σ(段功率 × 段时长)，与重量闭合里的电池/燃油计算同一份剖面",
      "E_task = Σ P_i·t_i",["Phov","Ptrans","Pcl","Pcr","Paux"]),
    fF:P(fF,"f_fuel","总燃油分数","—","calc",
      "燃油分数 = (巡航 + 爬升 + 下降 + 滑行) × (1+裕度) ÷ 起飞总重",
      "f_fuel = [Σ各段燃油](1+reserve)/W_TO",["W_TO"],
      "巡航用 Breguet，爬升按功率×时间，下降 2%、滑行 6%（可覆盖）"),
    W_TO:P(Wto,"W_TO","起飞总重","kg","calc",
      isElec?"总重 = 载重 + 空重 + 电池，需迭代求解":"总重 = 载重 ÷ (1 − 燃油分数 − 空重分数)",
      isElec?"W_TO = W_PL + f_E·W_TO + m_batt":"W_TO = W_PL/(1 − f_fuel − f_E)",
      isElec?["WPL","fE","mB"]:["WPL","fF","fE"]),
    W_E:P(WE,"W_E","空重","kg","calc","空重 = 空重分数 × 起飞总重","W_E = f_E·W_TO",["fE","W_TO"]),
    W_fuel:P(Wf,"W_fuel","燃油重量","kg","calc","燃油重量 = 燃油分数 × 起飞总重","W_fuel = f_fuel·W_TO",["fF","W_TO"]),
    m_batt:P(mB,"m_batt","电池质量","kg","calc",
      "电池质量 = max( 能量需求÷(放电深度×比能量) , 峰值功率÷电池比功率 )",
      "m_batt = max(E/(DoD·e), P_peak/(P/m))",["W_TO","Ppk"]),
    W_S:P(WS,"W/S","翼载","kg/m²","input","翼载 = 重量 ÷ 机翼面积","W/S",[]),
    S_wing:P(Sw,"S","机翼面积","m²","calc","机翼面积 = 起飞总重 ÷ 翼载","S = W_TO/(W/S)",["W_TO","W_S"]),
    b:P(bs,"b","翼展（几何参考）","m","calc","翼展 = √(展弦比 × 机翼面积)。注意：约束边界分析只用 W/S 与 W/P，翼展属于几何阶段输出，不参与约束求解","b = √(AR·S)",["AR","S_wing"]),
    AR:P(AR,"AR","展弦比（几何参考）","—","stat","展弦比 = 翼展² ÷ 机翼面积。同上：约束分析不需要它，只有算机翼平面形状时才用","AR = b²/S",[]),
    Vstall:P(Vstall,"V_s","失速速度","m/s","calc",
      "失速速度 = √(2 × 翼载 × 重力 ÷ (海平面密度 × 最大升力系数))",
      "V_s = √(2·(W/S)·g/(ρ0·C_Lmax))",["W_S","CLmax"]),
    CLmax:P(CLmax,"C_Lmax","最大升力系数","—","spec"),
    C_Lc:P(CLc,"C_Lc","巡航升力系数","—","calc",
      "巡航升力系数 = 2 × 巡航重量 ÷ (空气密度 × 速度² × 机翼面积)",
      "C_Lc = 2·W_c/(ρ·V²·S)",["W_TO","rho","V","S_wing"]),
    C_Li:P(CLi,"C_li","翼型设计升力系数","—","calc",
      "翼型设计升力系数 = 巡航升力系数 ÷ 0.95 ÷ 0.90",
      "C_li = C_Lc/0.95/0.90",["C_Lc"]),
    DoD:P(DoD,"DoD","放电深度","—","spec"),
    reserve:P(reserve,"reserve","能量裕度","—","spec"),
    ...(isElec?{
      Epack:P(battUsable?battInfo.wh:NaN,"E_pack","电池包标称能量","Wh",
        battUsable?"calc":"assume",
        "电池包标称能量 = 标称电压 × 额定容量","E_pack = V·Ah",[]),
      e_batt:P(eBatt,"e_batt","电池比能量","Wh/kg",battUsable?"calc":"stat",
        battUsable?"按你填的电池包换算：标称能量 ÷ 整包质量":"按参数值（或动力库典型值）取用",
        battUsable?"e = V·Ah/m":"e = const"),
      p_batt:P(pBatt,"p_batt","电池比功率","W/kg",
        battUsable?(isFinite(battInfo.p)?"calc":"assume"):"stat",
        battUsable?"按你填的电池包换算：标称电压 × 连续放电电流 ÷ 整包质量，用来核对功率约束"
                 :"按参数值取用，用来核对功率约束",
        battUsable?"P/m = V·I/m":"P/m = const")
    }:{})

  };
  res.Wto=Wto; res.fE=fE; res.LD=LD; res.rho=rho; res.WS=WS; res.S=Sw;
  res.Phov=Phov; res.Pcl=Pcl; res.Pcr=Pcr; res.Ppk=Ppk; res.Ptr=Ptr;
  res.Vstall=Vstall; res.Vapp=Vapp; res.isElec=isElec; res.isVTOL=isVTOL;
  res.CLc=CLc; res.CLi=CLi; res.b=bs; res.WE=WE;
  res.valid = solved;
  res.profile = fin.segs;
  res.fuelSegs = fin.fsegs;
  res.E_task = fin.E_task;
  res.Et = fin.Et;
  res.mBattE = fin.m1;
  res.mBattP = fin.m2;
  res.P_aux = pAux;
  res.kTrans = kTrans;
  res.battMode = battMode;
  res.battInfo = battInfo;
  res.eBatt = eBatt;
  res.pBatt = pBatt;
  res.DoD = DoD;
  res.rootsAll = roots.slice();
  if(isElec && battMode==="pack" && !battInfo.ok){
    res.warn.push(`电池包数据没算出来（${battInfo.msg}），比能量/比功率回落到参数值`);
  }
  res.tSeg = {hover:tHov, trans:tTrans, climb:tClimb, cruise:tCr, mission:tMission};
  res.fits={fE:fEf,LD:LDf};
  res.constraints = buildConstraints(res);
  return res;
}

/* ============================================================
   约束边界（9 条）
   ============================================================ */
function buildConstraints(res){
  const I=S.input, o=S.opt, Wto=res.Wto, rho=res.rho;
  const V=(I.V||0)/3.6, Vc=(I.Vc||0);          // V: km/h→m/s；Vc 本就是 m/s
  const CLmax=S.ov.CLmax??1.4, etaP=S.ov.etaP??0.78, etaT=S.ov.etaT??0.96;
  const ARc=S.ov.AR??6, eO=S.ov.eOswald??0.85;
  const W=Wto*G;
  const list=[];

  // 阻力极线的零升阻力：按重量闭合用的 L/D 反标定，让两条线出自同一个气动假设。
  // 没给 Cd0 时由设计巡航点反解；给了就尊重用户输入。
  const CLd = 2*res.WS*G/(rho*V*V);
  const cdInd = CLd*CLd/(Math.PI*eO*ARc);
  const Cd0 = S.ov.Cd0 ?? Math.max(0.006, Math.min(0.08, CLd/Math.max(2.0,res.LD) - cdInd));
  res.Cd0 = Cd0; res.CLd = CLd;

  // 巡航功率随翼载变化：型阻项 ∝ 1/(W/S)，诱导项 ∝ (W/S) → 曲线而非直线
  const pCruise=(ws)=>{
    const S=Wto/ws;
    const CL=2*ws*G/(rho*V*V);
    const Cd=Cd0+CL*CL/(Math.PI*eO*ARc);
    return 0.5*rho*V*V*V*S*Cd/(etaP*etaT);   // W
  };
  const toWP=wPerKW=>Wto*1000/wPerKW;        // W→W/P(kg/kW)

  // 曲线约束：给定 ws，返回所需 W/P 上限
  const CURVE=(id,name,f,color,zh)=>{
    const samples=[];
    for(let ws=5; ws<=1200; ws*=1.18){
      const pw=f(ws);
      if(!isFinite(pw)||pw<=0) continue;
      const wpv=toWP(pw);
      if(!isFinite(wpv)||wpv<=0) continue;
      samples.push([ws, wpv]);
    }
    if(samples.length>4) list.push({id,name,type:"c",samples,color,zh});
  };
  const H=(id,name,pw,color,zh)=>{ if(pw>0&&isFinite(pw)) list.push({id,name,type:"h",val:toWP(pw),color,zh}); };
  const Vline=(id,name,ws,color,zh)=>{ if(ws>0&&isFinite(ws)) list.push({id,name,type:"v",val:ws,color,zh}); };

  // C3 巡航平飞（曲线）
  CURVE("cruise","巡航平飞",ws=>pCruise(ws),"#2f6d8f","巡航平飞功率随翼载变化：型阻 ∝ 1/(W/S)，诱导 ∝ (W/S)");
  // C4 全发爬升（曲线）：梯度 γ
  if(o.gamma>0)
    CURVE("fwdclimb",`全发爬升 ${o.gamma}%`,ws=>pCruise(ws)+W*V*(o.gamma/100)/(etaP*etaT),"#c05621","巡航功率 + 爬升梯度所需功率");
  // C5 单发失效第二段（曲线）：只剩一半功率
  if(o.gammaOEI>0)
    CURVE("oei",`单发第二段 ${o.gammaOEI}%`,ws=>(pCruise(ws)+W*V*(o.gammaOEI/100)/(etaP*etaT))*1.9,"#9c3024","单发后剩余功率需维持的梯度");
  // C6 航路单发（曲线）
  if(o.gammaRoute>0)
    CURVE("route",`航路单发 ${o.gammaRoute}%`,ws=>(pCruise(ws)+W*V*(o.gammaRoute/100)/(etaP*etaT))*2.0,"#6b5b95","航路单发失效的最小梯度");

  // 悬停/过渡（VTOL 才有）：水平线
  if(res.isVTOL){
    H("hover","悬停",res.Phov,"#5b7c99","悬停功率");
    H("trans","过渡",res.Ptr,"#b08b6b",`倾转过渡段（${(res.kTrans??1.15)}×悬停功率）`);
    if(o.Vwind>0){
      const Vwind=o.Vwind*0.5144;
      H("wind",`抗风 ${o.Vwind}kt`,res.Phov+W*Vwind/(etaP*etaT)*0.5,"#4a7c8a","抗风悬停余量");
    }
  }
  // C2 着陆距离（竖线）
  if(o.SL>0){
    const ws=o.SL*rho*G*CLmax*0.30/1.9;
    Vline("sl",`着陆 ${o.SL}m`,ws,"#8a7a5a","着陆距离反推的翼载上限");
  }
  // 起飞距离（竖线）
  if(o.STO>0){
    const TWR=o.TWR ?? (res.isVTOL?0.50:0.30);
    const ws=o.STO*rho*G*CLmax*TWR/1.44;
    Vline("sto",`起飞 ${o.STO}m`,ws,"#7a6a99","起飞滑跑距离反推的翼载上限");
  }
  // 失速/进场速度（竖线）
  Vline("stall",`失速 V=${fmt(res.Vapp,0)}`,0.5*RHO0*res.Vapp*res.Vapp*CLmax/G,"#9c3024",
    "由进场速度与最大升力系数反推的翼载上界");
  // 盘旋过载（竖线）
  if(o.nTurn>0){
    const ws=0.5*rho*V*V*CLmax/(o.nTurn*G);
    Vline("turn",`盘旋 n=${o.nTurn}`,ws,"#6b8e5a","盘旋过载下的翼载上限");
  }
  return list;
}

function feasible(res, ws, wp){
  const cs=res.constraints||[];
  const maxWS=Math.min(...cs.filter(c=>c.type==="v").map(c=>c.val).concat([1e9]));
  let maxWP=Math.min(...cs.filter(c=>c.type==="h").map(c=>c.val).concat([1e9]));
  // 曲线约束：在该 W/S 处插值得到 W/P 上限
  for(const c of cs.filter(x=>x.type==="c")){
    const v=interpCurve(c.samples, ws);
    if(isFinite(v)&&v>0) maxWP=Math.min(maxWP, v);
  }
  return { maxWS, maxWP, ok: ws<=maxWS*1.001 && wp<=maxWP*1.001 };
}
function interpCurve(pts, x){
  if(!pts||pts.length<2) return NaN;
  if(x<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(x<=pts[i][0]){
      const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
      return y0+(y1-y0)*(x-x0)/((x1-x0)||1e-9);
    }
  }
  return pts[pts.length-1][1];
}

function gatherInput(){

  const I=S.input;
  if(isFinite(g("inWL"))) I.WPL=g("inWL");
  if(isFinite(g("inV"))) I.V=g("inV");
  if(isFinite(g("inR"))) I.R=g("inR");
  if(isFinite(g("inH"))) I.h=g("inH");
  if(isFinite(g("inTH"))) I.tHover=g("inTH");
  if(isFinite(g("inVC"))) I.Vc=g("inVC");
  if(isFinite(g("inHT"))) I.hTrans=g("inHT");

        <div class="kv"><span>适用范围</span><b>${fmt(Math.pow(10,fit.xmin),0)} – ${fmt(Math.pow(10,fit.xmax),0)} kg</b></div>
        <div class="note ${bad?"warn":"ok"}" style="margin-top:8px">
          ${bad?"<b>⚠ 该布局样本有限</b>，曲线只能当趋势看。":"<b>✓ 覆盖全重量段</b>，拟合 R² 可作参考。"}

function applyPts(kind){
  const ta=document.getElementById("pt_"+kind);
  const pts=ta.value.trim().split(/\n+/).map(l=>l.split(/[,\s]+/).map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])&&a[0]>0&&a[1]>0);
  if(pts.length<4) return alert("至少 4 个有效点");
  if(kind==="fE") DB.emptyFrac[dbKey()].points=pts; else DB.ld[dbKey()].points=pts;
  S.result=computeAll(); render();
}

function step3(){
  const r=S.result||computeAll();
  const fFe=fitCurve(DB.emptyFrac[dbKey()].points);
  const fLd=fitCurve(DB.ld[dbKey()].points);
  return `<h2>第三步 · 重量统计参数</h2>

  ${statCard("fE",fFe,DB.emptyFrac[dbKey()],"空重分数 f_E（空重 ÷ 起飞总重）","—")}
  ${ovBox("fE","空重分数 f_E",fFe,r.Wto)}
  ${statCard("LD",fLd,DB.ld[dbKey()],"升阻比 L/D（巡航）","—")}
  ${ovBox("LD","升阻比 L/D",fLd,r.Wto)}`;
}
function ovBox(key,name,fit,w){
  if(!fit.ok) return "";
  const pred=fit.predict(w);
  const cur=S.ov[key]??pred.v;
  const lo=pred.v*0.85, hi=pred.v*1.15;
  return `<div class="card" style="border-left:4px solid var(--acc)">
    <h3>确认取值：${name}</h3>
    <div class="optrow">
      <div style="flex:1;min-width:220px">
        <div class="sub2">当前总重 ${fmt(w,1)} kg 处拟合值 <b>${fmt(cur,cur>1?2:3)}</b>${pred.extrap?"（外推）":""}</div>
        <input type="range" min="${lo.toFixed(3)}" max="${hi.toFixed(3)}" step="0.001" value="${cur}"
          oninput="document.getElementById('ov_${key}').value=this.value">
      </div>

/* ============================================================
   绘图
   ============================================================ */
function dpr(cv,w,h){
  const d=window.devicePixelRatio||1;
  cv.width=w*d; cv.height=h*d; cv.style.width=w+"px"; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.scale(d,d); return c;
}
function drawFit(cv, fit, data){
  const W=cv.clientWidth||640, H=parseInt(cv.style.height)||290;
  const c=dpr(cv,W,H), pad={l:54,r:14,t:14,b:34};
  const pts=data.points;
  const xs=pts.map(p=>Math.log10(p[0])), ys=pts.map(p=>Math.log10(p[1]));
  const x0=Math.min(...xs)-0.15, x1=Math.max(...xs)+0.15;
  const y0=Math.min(...ys)-0.12, y1=Math.max(...ys)+0.12;
  const X=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r);
  const Y=v=>H-pad.b-(v-y0)/(y1-y0)*(H-pad.t-pad.b);
  c.clearRect(0,0,W,H);
  c.strokeStyle="#eee9e2"; c.font="10.5px Consolas"; c.fillStyle="#8a8f98";
  for(let i=0;i<=5;i++){
    const gx=x0+(x1-x0)*i/5, gy=y0+(y1-y0)*i/5;
    c.beginPath();c.moveTo(X(gx),Y(y0));c.lineTo(X(gx),Y(y1));c.stroke();
    c.beginPath();c.moveTo(X(x0),Y(gy));c.lineTo(X(x1),Y(gy));c.stroke();
    c.textAlign="center"; c.fillText(Math.pow(10,gx).toFixed(0), X(gx), H-13);
    c.textAlign="right"; c.fillText(Math.pow(10,gy).toPrecision(2), X(x0)-5, Y(gy)+3);
  }
  if(fit.ok){
    c.beginPath(); let first=true;
    for(let i=0;i<=80;i++){
      const wx=Math.pow(10,x0+(x1-x0)*i/80);
      const p=fit.predict(wx);
      if(!isFinite(p.v)||p.v<=0) continue;
      const yy=Y(Math.log10(p.v));
      first?(c.moveTo(X(Math.log10(wx)),yy),first=false):c.lineTo(X(Math.log10(wx)),yy);
    }
    c.strokeStyle="#c05621"; c.lineWidth=2.2; c.stroke();
  }
  for(const [wx,vy] of pts){
    c.beginPath(); c.arc(X(Math.log10(wx)),Y(Math.log10(vy)),3.4,0,7);
    c.fillStyle="#16324f"; c.fill(); c.strokeStyle="#fff"; c.lineWidth=1.1; c.stroke();
  }
  c.fillStyle="#6b7280"; c.font="11.5px 'Microsoft YaHei'";
  c.textAlign="center"; c.fillText("起飞总重 W_TO [kg，对数轴]", W/2, H-1);
  c.save(); c.translate(12,H/2); c.rotate(-Math.PI/2); c.textAlign="center";
  c.fillText("纵轴（对数）", 0,0); c.restore();
}

function drawConstraints(cv, res, ws, wp){
  // 防护：空值/NaN 会让整张画布失效
  if(!isFinite(ws)||ws<=0) ws=20;
  if(!isFinite(wp)||wp<=0) wp=10;
  const W=cv.clientWidth||680, H=parseInt(cv.style.height)||320;
  const c=dpr(cv,W,H), pad={l:64,r:16,t:16,b:40};
  const cs=res.constraints||[];
  const vVals=cs.filter(x=>x.type==="v").map(x=>x.val).filter(v=>isFinite(v)&&v>0);
  const hVals=cs.filter(x=>x.type==="h").map(x=>x.val).filter(v=>isFinite(v)&&v>0);
  const curves=cs.filter(x=>x.type==="c");

  // 先用竖线与设计点定横轴
  const vmax=Math.max(ws, ...vVals, 10);
  const x1=Math.max(60, vmax*1.1);
  const x0=0;
  // 纵轴：横线 + 曲线在可视区间内的值
  let ymax=Math.max(wp, ...hVals, 5);
  for(const cu of curves){
    for(const [cx,cy] of cu.samples){
      if(cx>=x0 && cx<=x1 && isFinite(cy) && cy>0) ymax=Math.max(ymax, cy);
    }
  }
  const y1=Math.max(5, ymax*1.25), y0=0;
  const X=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r);
  const Y=v=>H-pad.b-(v-y0)/(y1-y0)*(H-pad.t-pad.b);
  c.clearRect(0,0,W,H);

  const niceStep=(span)=>{const raw=span/5; const pw=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/pw;
    return (n<=1?1:n<=2?2:n<=5?5:10)*pw;};
  const sx=niceStep(x1-x0), sy=niceStep(y1-y0);
  c.strokeStyle="#eee9e2"; c.font="10.5px Consolas"; c.fillStyle="#8a8f98";
  for(let v=0; v<=x1+1e-9; v+=sx){
    c.beginPath();c.moveTo(X(v),Y(y0));c.lineTo(X(v),Y(y1));c.stroke();
    c.textAlign="center"; c.fillText(v>=1000?(v/1000).toFixed(0)+"k":(sx<1?v.toFixed(1):v.toFixed(0)),X(v),H-19);
  }
  for(let v=0; v<=y1+1e-9; v+=sy){
    c.beginPath();c.moveTo(X(x0),Y(v));c.lineTo(X(x1),Y(v));c.stroke();
    c.textAlign="right"; c.fillText(v>=1000?(v/1000).toFixed(0)+"k":(sy<1?v.toFixed(1):v.toFixed(0)),X(x0)-6,Y(v)+3);
  }

  // 可行域（以设计点所在 W/S 处各约束的最小 W/P 为上界）
  const f=feasible(res,ws,wp);
  const mWS=Math.min(f.maxWS,x1), mWP=Math.min(f.maxWP,y1);
  if(mWS>x0&&mWP>y0){c.fillStyle="rgba(47,93,80,.10)";c.fillRect(X(x0),Y(mWP),X(mWS)-X(x0),Y(y0)-Y(mWP));}

  // 先画竖线/横线
  cs.filter(x=>x.type!=="c").forEach(cc=>{
    c.strokeStyle=cc.color; c.lineWidth=2; c.setLineDash(cc.type==="v"?[]:[]);
    if(cc.type==="v"){
      if(cc.val<x0||cc.val>x1) return;
      c.beginPath();c.moveTo(X(cc.val),Y(y0));c.lineTo(X(cc.val),Y(y1));c.stroke();
      c.save(); c.translate(X(cc.val)-4, Y(y1)+6); c.rotate(-Math.PI/2);
      c.fillStyle=cc.color; c.font="10.5px 'Microsoft YaHei'"; c.textAlign="left";
      c.fillText(cc.name, 0, 0); c.restore();
    }else{
      if(cc.val<y0||cc.val>y1) return;
      c.beginPath();c.moveTo(X(x0),Y(cc.val));c.lineTo(X(x1),Y(cc.val));c.stroke();
      c.fillStyle=cc.color; c.font="10.5px 'Microsoft YaHei'"; c.textAlign="left";
      c.fillText(cc.name, X(x0)+5, Y(cc.val)-4);
    }
  });
  // 再画曲线
  curves.forEach(cc=>{
    c.strokeStyle=cc.color; c.lineWidth=2.2; c.setLineDash([7,4]);
    c.beginPath(); let first=true, lastPt=null;
    for(const [cx,cy] of cc.samples){
      if(!isFinite(cx)||!isFinite(cy)||cx<x0||cx>x1||cy<y0||cy>y1){ first=true; continue; }
      const px=X(cx), py=Y(cy);
      first?(c.moveTo(px,py),first=false):c.lineTo(px,py);
      lastPt=[px,py];
    }
    c.stroke(); c.setLineDash([]);
    if(lastPt){
      c.fillStyle=cc.color; c.font="10.5px 'Microsoft YaHei'"; c.textAlign="right";
      c.fillText(cc.name, X(x1)-4, lastPt[1]-6);
    }
  });

  // 设计点
  const px=X(ws), py=Y(wp);
  c.beginPath();c.arc(px,py,7,0,7);
  c.fillStyle=f.ok?"#9c3024":"#7a2a1f"; c.fill();
  c.strokeStyle="#fff"; c.lineWidth=2; c.stroke();
  c.fillStyle=f.ok?"#9c3024":"#7a2a1f"; c.font="11.5px 'Microsoft YaHei'"; c.textAlign="left";
  c.fillText(f.ok?"设计点":"不可行", px+11, py+4);

  c.strokeStyle="#1f2328"; c.lineWidth=1;
  c.beginPath();c.moveTo(X(x0),Y(y0));c.lineTo(X(x1),Y(y0));c.stroke();
  c.beginPath();c.moveTo(X(x0),Y(y0));c.lineTo(X(x0),Y(y1));c.stroke();
  c.fillStyle="#6b7280"; c.font="11.5px 'Microsoft YaHei'"; c.textAlign="center";
  c.fillText("翼载 W/S  [kg/m²]", W/2, H-3);
  c.save(); c.translate(14,H/2); c.rotate(-Math.PI/2); c.textAlign="center";
  c.fillText("功率载荷 W/P  [kg/kW]", 0,0); c.restore();
  cv._map={pad,x0,x1,y0,y1,W,H,X,Y};
  return f;
}

function drawConv(cv, its){
  const W=cv.clientWidth||320, H=parseInt(cv.style.height)||240;
  const c=dpr(cv,W,H), pad={l:52,r:12,t:14,b:26};
  const ys=its.map(t=>t.Wto);
  const y0=Math.min(...ys)*0.97, y1=Math.max(...ys)*1.03;
  const x0=0.5, x1=Math.max(3,its.length+0.5);
  const X=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r);
  const Y=v=>H-pad.b-(v-y0)/(y1-y0)*(H-pad.t-pad.b);
  c.clearRect(0,0,W,H);
  c.strokeStyle="#eee9e2"; c.font="10px Consolas"; c.fillStyle="#8a8f98";
  for(let i=0;i<=4;i++){
    const gv=y0+(y1-y0)*i/4;
    c.beginPath();c.moveTo(X(x0),Y(gv));c.lineTo(X(x1),Y(gv));c.stroke();
    c.textAlign="right"; c.fillText(gv.toFixed(2),X(x0)-5,Y(gv)+3);
  }
  c.beginPath();
  its.forEach((t,i)=>{ const x=X(i+1),y=Y(t.Wto); i?c.lineTo(x,y):c.moveTo(x,y); });
  c.strokeStyle="#c05621"; c.lineWidth=2.1; c.stroke();
  its.forEach((t,i)=>{
    c.beginPath();c.arc(X(i+1),Y(t.Wto),3.2,0,7); c.fillStyle="#16324f";c.fill();
    c.strokeStyle="#fff";c.lineWidth=1;c.stroke();
  });
  c.fillStyle="#6b7280";c.font="11px 'Microsoft YaHei'";c.textAlign="center";
  c.fillText("迭代轮次",W/2,H-4);
}

/* ---------- 步骤 5–9 ---------- */
function kpi(label,val,unit,key){
  return `<div class="card" style="padding:13px 15px;margin:0">
    <div class="sub2">${label}</div>
    <div style="font-size:21px;font-weight:700;color:#16324f;font-family:Consolas;margin-top:2px">${val}
      <span style="font-size:11.5px;color:#6b7280;font-weight:400">${unit}</span></div>
    ${key?`<span class="clickable" style="font-size:11px" onclick="openTrace('${key}')">溯源</span>`:""}
  </div>`;
}

function step5(){
  const r=S.result||computeAll();
  const rows=r.iters.map((t,i)=>`<tr>
    <td class="num">${t.k}</td><td class="num">${fmt(t.Wto,3)}</td>
    <td class="num">${fmt(t.fE,4)}</td><td class="num">${fmt(t.LD,2)}</td>
    <td class="num">${fmt(r.isElec?t.mB:t.fuel,3)}</td>
    <td class="num">${fmt(t.resid,3)}</td>
    <td class="num">${fmt(t.conv,3)}</td></tr>`).join("");
  const bad=!r.valid;
  return `<h2>第五步 · 重量闭合</h2>
  ${bad?`<div class="note warn" style="margin-bottom:13px;font-size:13.5px">
    <b>✗ 无解：在载重的 1–60 倍范围内找不到自洽总重。</b><br>
    下面不再给出总重、功率、面积等指标——它们都由未闭合的总重推出来，填进去会被误当成方案。<br>
    可调方向：加大桨径、缩短悬停时间、提高电池比能量、把空重分数填得更确切（比如 0.55）、降低航程或速度。</div>`:""}
  <div class="hint">${r.isElec
    ?"电机：电池质量是总重的函数，每轮把新总重回填能量计算。下表是扫描找到区间后二分收缩的真实过程"
    :"油机：燃油分数与总重基本无关，几轮即收敛（空重分数的非线性需要吸收）。下表是真实二分过程"}</div>
  ${bad?"":`<div class="card"><h3>迭代过程 <span class="tag">扫描 + 二分，真实记录</span></h3>
    <div class="fitwrap">
      <div style="overflow:auto;max-height:300px"><table>
        <thead><tr><th>轮次</th><th class="num">W_TO kg</th><th class="num">f_E</th><th class="num">L/D</th>
        <th class="num">${r.isElec?"电池":"燃油"} kg</th><th class="num">残差 kg</th><th class="num">区间半宽 kg</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div><canvas class="chart" id="cvConv" style="height:240px"></canvas></div>
    </div>
  </div>
  <div class="grid g4">
    ${kpi("起飞总重 W_TO",fmt(r.Wto,3),"kg","W_TO")}
    ${kpi("空重 W_E",fmt(r.WE,3),"kg","W_E")}
    ${r.isElec?kpi("电池 m_batt",fmt(r.p.m_batt.v,3),"kg","m_batt")
              :kpi("燃油 W_fuel",fmt(r.p.W_fuel.v,3),"kg","W_fuel")}
    ${kpi("峰值功率",fmt(r.Ppk/1000,2),"kW","Ppk")}
  </div>`}`;
}

function step6(){
  const r=S.result||computeAll();
  if(!r.valid){
    return `<h2>第六步 · 剖面功率</h2>
    <div class="note warn" style="font-size:13.5px"><b>✗ 重量没有闭合，剖面无意义。</b><br>
    功率与能量都按总重算，总重没定下来就不会有可信的剖面。请回第五步调整参数。</div>`;
  }
  const kW=v=>fmt(v/1000,2);
  const en=v=>v>=1000?fmt(v/1000,1)+" kWh":fmt(v,1)+" Wh";
  const seg=r.profile||[];
  const totE=seg.reduce((a,s)=>a+s[1]*s[2]/3600,0);
  const totT=seg.reduce((a,s)=>a+s[2],0);
  const fseg=r.isElec?null:(r.fuelSegs||[]);
  const sumF=fseg?fseg.reduce((a,s)=>a+s[1],0):0;
  return `<h2>第六步 · 剖面功率</h2>
  <div class="hint">这段剖面就是重量闭合里用的同一份：功率×时长=能量，逐项相加等于电池/燃油质量</div>
  <div class="card"><h3>剖面功率与能量 <span class="tag">${r.isElec?"电池按能量或峰值功率取大":"燃油逐项相加"}</span></h3>
    <table><thead><tr><th>阶段</th><th class="num">功率 kW</th><th class="num">时长 s</th>
    <th class="num">能量 Wh</th><th>说明</th></tr></thead><tbody>
    ${seg.map(([n,p,t,d])=>`<tr><td>${n}</td><td class="num">${kW(p)}</td>
      <td class="num">${fmt(t,0)}</td><td class="num">${en(p*t/3600)}</td>
      <td class="sub2">${d}</td></tr>`).join("")}
    <tr class="total"><td>合计</td><td class="num">—</td><td class="num">${fmt(totT,0)}</td>
      <td class="num">${en(totE)}</td><td class="sub2">${r.isElec
        ? `再乘能量裕度 ${fmt((S.ov.reserve??0.2)*100,0)}% = ${en(r.Et)}`
        : `轴功口径；对应燃油 ${fmt(sumF,1)} kg（见下表）`}</td></tr>
  </tbody></table>
  ${r.isElec&&r.mBattP>r.mBattE*1.02?`<div class="note" style="margin-top:9px">
    电池质量由放电功率决定（峰值 ${fmt(r.Ppk/1000,2)} kW → ${fmt(r.mBattP,2)} kg），不是能量（${fmt(r.mBattE,2)} kg）。</div>`:""}
  </div>
  ${fseg?`<div class="card"><h3>燃油分配 <span class="tag">逐项相加 = 总燃油</span></h3><table>
    <thead><tr><th>项目</th><th class="num">燃油 kg</th><th class="num">占比</th></tr></thead><tbody>
    ${fseg.map(([n,v])=>`<tr><td>${n}</td><td class="num">${fmt(v,1)}</td>
      <td class="num">${fmt(v/(r.p.W_fuel.v||1)*100,1)}%</td></tr>`).join("")}
    <tr class="total"><td>合计</td><td class="num">${fmt(r.p.W_fuel.v,1)}</td><td class="num">100%</td></tr>
  </tbody></table></div>`:""}
  <div class="grid g3">
    ${kpi("悬停功率",kW(r.Phov),"kW","Phov")}
    ${kpi("巡航功率",kW(r.Pcr),"kW","Pcr")}
    ${kpi("峰值功率",kW(r.Ppk),"kW","Ppk")}
  </div>`;
}

function step7(){
  const r=S.result||computeAll();
  if(!r.valid){
    return `<h2>第七步 · 约束边界与设计点</h2>
    <div class="note warn" style="font-size:13.5px"><b>✗ 重量没有闭合，约束图不画。</b><br>
    约束图上的可行域是按当前总重算出来的，总重没定下来就没有意义。</div>`;
  }
  const ws0=S.ov.WS??r.WS;
  const f=feasible(r, ws0, 1e9);
  const ws=ws0;
  const wpRail=feasible(r, ws, 1e9).maxWP;
  const wp=S.ov.WP??(isFinite(wpRail)&&wpRail<1e8?wpRail*0.85:10);
  const lines=r.constraints.map(c=>`<span><i style="background:${c.color}"></i>${c.name}</span>`).join("");
  return `<h2>第七步 · 约束边界与设计点</h2>
  <div class="hint">竖线是翼载上限，横线是功率载荷上限，阴影是可行域。可点图、拖滑条或直接输数</div>
  <div class="card">
    <canvas class="chart" id="cvCons" style="height:340px;max-width:780px"></canvas>
    <div class="legend">${lines}</div>
  </div>
  <div class="card"><h3>选点</h3>
    <div class="grid g2">
      <div class="field"><label>翼载 W/S　<span class="clickable" onclick="openTrace('W_S')">?</span></label>
        <input type="range" id="rgWS" min="5" max="60" step="0.5" value="${ws.toFixed(1)}"
          oninput="document.getElementById('inWS').value=this.value;setPt()">
        <input id="inWS" type="number" step="0.5" value="${ws.toFixed(1)}"
          oninput="document.getElementById('rgWS').value=this.value;setPt()">
        <div class="unit">kg/m²（上限 ${fmt(f.maxWS,1)}）</div></div>
      <div class="field"><label>功率载荷 W/P</label>
        <input type="range" id="rgWP" min="2" max="60" step="0.5" value="${wp.toFixed(1)}"
          oninput="document.getElementById('inWP').value=this.value;setPt()">
        <input id="inWP" type="number" step="0.5" value="${wp.toFixed(1)}"
          oninput="document.getElementById('rgWP').value=this.value;setPt()">
        <div class="unit">kg/kW（上限 ${fmt(f.maxWP,1)}）</div></div>
    </div>
    <div id="feasMsg" style="margin-top:13px"></div>
  </div>`;
}
function setPt(){
  let ws=parseFloat(document.getElementById("inWS").value);
  let wp=parseFloat(document.getElementById("inWP").value);
  if(!isFinite(ws)||ws<=0){ ws=20; document.getElementById("inWS").value=ws; document.getElementById("rgWS").value=ws; }
  if(!isFinite(wp)||wp<=0){
    const f0=feasible(S.result, ws, 1e9);
    wp=isFinite(f0.maxWP)&&f0.maxWP<1e8 ? f0.maxWP*0.85 : 10;
    document.getElementById("inWP").value=wp.toFixed(1);
    document.getElementById("rgWP").value=wp.toFixed(1);
  }
  S.ov.WS=ws; S.ov.WP=wp;
  const r=S.result, f=feasible(r,ws,wp);
  const box=document.getElementById("feasMsg");
  box.innerHTML = f.ok
    ? `<div class="note ok">✓ 可行：翼载 ${fmt(ws,1)} ≤ ${fmt(f.maxWS,1)}，功率载荷 ${fmt(wp,1)} ≤ ${fmt(f.maxWP,1)}</div>`
    : `<div class="note warn">✗ 不可行：${ws>f.maxWS?`翼载超出上限 ${fmt(f.maxWS,1)}；`:""}${wp>f.maxWP?`功率载荷超出上限 ${fmt(f.maxWP,1)}`:""}</div>`;
  drawConstraints(document.getElementById("cvCons"), r, ws, wp);
}

function step8(){
  const r=S.result||computeAll();
  if(!r.valid){
    return `<h2>第八步 · 升力系数与失速速度</h2>
    <div class="note warn" style="font-size:13.5px"><b>✗ 重量没有闭合，升力系数与失速速度都不成立。</b><br>
    这两个量都由总重与机翼面积推出来。</div>`;
  }
  const ws=r.WS, Sw=r.S;
  const CLc=r.CLc;
  const CLi=r.CLi;
  const line=(key,sym,name,zh,symF,val)=>`
    <div class="trace-row"><span>${name} <span class="clickable" onclick="openTrace('${key}')">${sym}</span></span>
      <span><b>${fmt(val,3)}</b></span></div>
    <div class="sub2" style="font-family:Consolas;padding-bottom:5px">${symF}</div>`;
  return `<h2>第八步 · 升力系数与失速速度</h2>
  <div class="hint">注意：失速速度不是输入，是由翼载和最大升力系数反推出来的结果</div>
  <div class="card"><h3>推导链</h3>
    ${line("C_Lc","C_Lc","巡航升力系数","","C_Lc = 2W_c/(ρV²S)",CLc)}
    ${line("C_Li","C_li","翼型设计升力系数","","C_li = C_Lc/0.95/0.90",CLi)}
    ${line("Vstall","V_s","失速速度","","V_s = √(2(W/S)g/(ρ0·C_Lmax))",r.Vstall)}
  </div>
  <div class="grid g4">
    ${kpi("机翼面积 S",fmt(Sw,3),"m²","S_wing")}
    ${kpi("翼展 b（参考）",fmt(Math.sqrt((S.ov.AR??6)*Sw),2),"m","b")}
    ${kpi("失速速度",fmt(r.Vstall,1),"m/s","Vstall")}
    ${kpi("翼型设计 C_li",fmt(CLi,3),"—","C_Li")}
  </div>
  <div class="note" style="margin-top:12px">
    0.95 近似机身与尾翼贡献，0.90 是三维机翼效应。取 ${fmt(ws,1)} kg/m² 翼载时，
    失速速度 ${fmt(r.Vstall,1)} m/s，约为巡航速度的 ${fmt(r.Vstall/(S.input.V/3.6)*100,0)}%。
  </div>`;
}

function step9(){
  const r=S.result||computeAll();
  const bad=!r.valid;
  const order=["WPL","V","R","h","rho","W_TO","W_E","W_fuel","m_batt","fE","LD",
               "Phov","Pcl","Pcr","Ppk","W_S","S_wing","b","AR","Vstall","C_Lc","C_Li","FM"];
  const shown=order.filter(k=>{
    if(k==="m_batt") return r.isElec;
    if(k==="W_fuel") return !r.isElec;
    if((k==="Phov"||k==="Pcl") && !r.isVTOL) return false;
    return true;
  });
  const rows=shown.filter(k=>r.p[k]).map(k=>{
    const p=r.p[k];
    const cls=p.src==="input"?"b-in":p.src==="stat"?"b-stat":p.src==="spec"?"b-spec":"b-calc";
    const val=bad&&(p.src==="calc")?"—":fmtG(p.v,5);
    return `<tr onclick="openTrace('${k}')" style="cursor:pointer">
      <td style="font-family:Consolas;color:#16324f;font-weight:600">${p.sym}</td>
      <td>${p.name}</td><td class="num">${val}</td><td>${p.unit||""}</td>
      <td><span class="badge ${cls}">${SRC_LABEL[p.src]||p.src}</span></td></tr>`;
  }).join("");
  return `<h2>第九步 · 参数总表</h2>
  ${bad?`<div class="note warn" style="margin-bottom:12px"><b>✗ 重量没有闭合，下表里所有「计算」项都无效（已显示 —）。</b><br>
    只剩输入项与统计项可以参考。请回第五步按提示调参。</div>`:""}
  <div class="hint">点任意一行打开溯源卡片：中文公式 + 符号表达式 + 上游参数</div>
  <div class="card"><table>
    <thead><tr><th>符号</th><th>含义</th><th class="num">数值</th><th>单位</th><th>来源</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <div class="card"><h3>结果摘要</h3>
    <div class="kv"><span>起飞总重</span><b>${bad?"无解":fmt(r.Wto,3)+" kg"}</b></div>
    <div class="kv"><span>空重</span><b>${bad?"—":fmt(r.WE,3)+" kg"}</b></div>
    <div class="kv"><span>${r.isElec?"电池":"燃油"}</span><b>${bad?"—":fmt(r.isElec?r.p.m_batt.v:r.p.W_fuel.v,3)+" kg"}</b></div>
    <div class="kv"><span>翼载 / 机翼面积</span><b>${fmt(r.WS,1)} kg/m² / ${bad?"—":fmt(r.S,3)+" m²"}</b></div>
    <div class="kv"><span>失速速度</span><b>${bad?"—":fmt(r.Vstall,1)+" m/s"}</b></div>
  </div>
  ${verifyUI()}
  <div style="display:flex;gap:11px"><button class="btn" onclick="window.print()">打印 / 另存 PDF</button>
    <button class="btn ghost" onclick="exportTxt()">导出文本</button></div>`;
}

/* 9 架实机：每架用自己的载重、巡航速度、航程、高度，只有 f_E 与 L/D 取自统计库 */
const VSET = [
  ["Cessna 172S","piston",237,233,1185,2000,1157],
  ["Piper PA-28-181","piston",271,230,900,1500,1157],
  ["Diamond DA40","piston",238,260,1300,2000,1150],
  ["Cessna 182T","piston",272,270,1720,2000,1406],
  ["Cirrus SR22","piston",362,340,1800,2500,1633],
  ["King Air 350","turboprop",638,580,3300,9000,6804],
  ["Boeing 737-800","turbofan",15400,840,5400,11000,79016],
  ["Airbus A330-300","turbofan",36000,871,11750,11500,242000],
  ["Bombardier Q400","turboprop",7000,667,2040,7600,29574]
];
function verifyUI(){
  const rows=VSET.map((v,i)=>`<tr>
      <td>${v[0]}</td><td class="num">${v[2]}</td><td class="num">${v[3]}</td>
      <td class="num">${v[4]}</td><td class="num">${v[5]}</td>
      <td class="num">${v[6]}</td><td id="vO${i}" class="num">—</td></tr>`).join("");
  return `<div class="card"><h3>实机单点核对 · 9 架 <span class="tag">不是适航意义上的验证</span></h3>
    <p class="sub2" style="margin:0 0 9px">每架都按它自己的载重、巡航速度、航程与高度算，
    只有空重分数与升阻比取自统计库——所以偏差归属统计曲线，不是参数抄错。</p>
    <table><thead><tr><th>机型</th><th class="num">载重 kg</th><th class="num">V km/h</th>
      <th class="num">R km</th><th class="num">h m</th><th class="num">实际 W_TO kg</th>
      <th class="num">预测 / 偏差</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <button class="btn ghost" style="margin-top:10px" onclick="runVerify()">跑一遍 9 架</button>
    <div id="vSum"></div></div>`;
}
function runVerify(){
  const save={WPL:S.input.WPL,V:S.input.V,R:S.input.R,h:S.input.h,config:S.config,
              layout:S.layout,category:S.category};
  let sum=0, n=0, ok15=0;
  VSET.forEach((v,i)=>{
    const [name,pw,PL,Vv,R,h,Wact]=v;
    const out=document.getElementById(`vO${i}`);
    if(!out) return;
    const saveP=S.power;
    S.power=pw; S.config="fixedwing"; S.layout="normal"; S.category="manned";
    S.input.WPL=PL; S.input.V=Vv; S.input.R=R; S.input.h=h;
    let r; try{ r=computeAll(); }catch(e){ out.textContent="出错"; S.power=saveP; return; }
    S.power=saveP;
    if(!r.valid){ out.innerHTML=`<span style="color:#9c3024">无解</span>`; return; }
    const err=(r.Wto-Wact)/Wact*100;
    sum+=Math.abs(err); n++; if(Math.abs(err)<=15) ok15++;
    out.innerHTML=`<b>${fmt(r.Wto,0)}</b> <span style="color:${Math.abs(err)<=15?"#2f5d50":"#9c3024"}">${err>0?"+":""}${err.toFixed(1)}%</span>`;
  });
  S.config=save.config; S.layout=save.layout; S.category=save.category;
  Object.assign(S.input, {WPL:save.WPL,V:save.V,R:save.R,h:save.h});
  document.getElementById("vSum").innerHTML = n===0?"":
    `<div class="note" style="margin-top:10px">
       ${n} 架平均绝对偏差 <b>${fmt(sum/n,1)}%</b>，15% 内 ${ok15} 架。两架偏大的分别是空重分数曲线偏低
       （PA-28）与商载率过低导致挑根偏离（King Air）——不是数据点异常。<br>
       这是单点核对，不是适航意义上的验证；不要把 15% 当作合格线。</div>`;
}
function exportTxt(){
  const r=S.result;
  if(!r) return;
  if(!r.valid) return alert("重量闭合无解，当前这套数字不是方案，不做导出。");
  const L=["总体参数计算结果",
    `动力=${DB.power[S.power].name}　布局=${DB.emptyFrac[dbKey()].name}　构型=${S.config}`,
    "--------------------------------"];
  for(const p of Object.values(r.p)) if(typeof p.v==="number")
    L.push(`${p.sym}\t${p.name}\t${p.v.toPrecision(5)}\t${p.unit||""}\t${SRC_LABEL[p.src]}`);
  const t=L.join("\n");
  navigator.clipboard?.writeText(t).then(()=>alert("已复制 "+t.length+" 字符")).catch(()=>{
    const w=window.open(""); w.document.write("<pre>"+t+"</pre>");});
}

function afterRender(){
  if(S.step===3 && DB.emptyFrac[dbKey()]){
    const fFe=fitCurve(DB.emptyFrac[dbKey()].points);
    const fLd=fitCurve(DB.ld[dbKey()].points);
    const c1=document.getElementById("cv_fE"), c2=document.getElementById("cv_LD");
    if(c1) drawFit(c1,fFe,DB.emptyFrac[dbKey()]);
    if(c2) drawFit(c2,fLd,DB.ld[dbKey()]);
  }
  if(S.step===4){
    ["inPackV","inPackAh","inPackM","inPackA","inPackC"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener("input", updateBattHint);
    });
    updateBattHint();
    const cv=document.getElementById("cvEng");
    const P0=DB.power[S.power];
    if(cv && P0.bsfcPts){
      const f=fitCurve(P0.bsfcPts);
      const w=cv.clientWidth||600, hh=parseInt(cv.style.height)||230;
      const c=dpr(cv,w,hh), pad={l:58,r:14,t:14,b:30};
      const xs=P0.bsfcPts.map(p=>Math.log10(p[0])), ys=P0.bsfcPts.map(p=>Math.log10(p[1]));
      const x0=Math.min(...xs)-0.1, x1=Math.max(...xs)+0.1;
      const y0=Math.min(...ys)-0.08, y1=Math.max(...ys)+0.08;
      const X=v=>pad.l+(v-x0)/(x1-x0)*(w-pad.l-pad.r);
      const Y=v=>hh-pad.b-(v-y0)/(y1-y0)*(hh-pad.t-pad.b);
      c.clearRect(0,0,w,hh);
      c.strokeStyle="#eee9e2"; c.font="10px Consolas"; c.fillStyle="#8a8f98";
      for(let i=0;i<=4;i++){
        const gx=x0+(x1-x0)*i/4, gy=y0+(y1-y0)*i/4;
        c.beginPath();c.moveTo(X(gx),Y(y0));c.lineTo(X(gx),Y(y1));c.stroke();
        c.beginPath();c.moveTo(X(x0),Y(gy));c.lineTo(X(x1),Y(gy));c.stroke();
        c.textAlign="center"; c.fillText(Math.pow(10,gx).toFixed(0),X(gx),hh-10);
        c.textAlign="right"; c.fillText(Math.pow(10,gy).toFixed(2),X(x0)-5,Y(gy)+3);
      }
      if(f.ok){
        c.beginPath(); let first=true;
        for(let i=0;i<=60;i++){
          const p=Math.pow(10,x0+(x1-x0)*i/60), q=f.predict(p);
          if(!isFinite(q.v)||q.v<=0) continue;
          const yy=Y(Math.log10(q.v));
          first?(c.moveTo(X(Math.log10(p)),yy),first=false):c.lineTo(X(Math.log10(p)),yy);
        }
        c.strokeStyle="#c05621"; c.lineWidth=2.2; c.stroke();
      }
      P0.bsfcPts.forEach(([px,py])=>{
        c.beginPath();c.arc(X(Math.log10(px)),Y(Math.log10(py)),3.4,0,7);
        c.fillStyle="#16324f";c.fill();c.strokeStyle="#fff";c.lineWidth=1.1;c.stroke();
      });
      c.fillStyle="#6b7280";c.font="11px 'Microsoft YaHei'";c.textAlign="center";
      c.fillText("功率 [kW，对数轴]",w/2,hh-1);
      c.save();c.translate(12,hh/2);c.rotate(-Math.PI/2);c.textAlign="center";
      c.fillText("比油耗 [对数]",0,0);c.restore();
    }
  }
  if(S.step===5 && S.result && S.result.valid){
    const cv=document.getElementById("cvConv");
    if(cv) drawConv(cv,S.result.iters);
  }
  if(S.step===7 && S.result && S.result.valid){
    const cv=document.getElementById("cvCons");
    if(cv){
      const r=S.result;
      const ws=parseFloat(document.getElementById("inWS").value);
      const wp=parseFloat(document.getElementById("inWP").value);
      drawConstraints(cv,r,ws,wp);
      cv.onclick=e=>{
        const rect=cv.getBoundingClientRect(), m=cv._map;
        const ws2=Math.max(5,Math.min(60, m.x0+(e.clientX-rect.left-m.pad.l)/(m.W-m.pad.l-m.pad.r)*(m.x1-m.x0)));
        const wp2=Math.max(2,Math.min(60, m.y0+(m.H-m.pad.b-(e.clientY-rect.top))/(m.H-m.pad.t-m.pad.b)*(m.y1-m.y0)));
        document.getElementById("inWS").value=ws2.toFixed(1);
        document.getElementById("rgWS").value=ws2.toFixed(1);
        document.getElementById("inWP").value=wp2.toFixed(1);
        document.getElementById("rgWP").value=wp2.toFixed(1);
        setPt();
      };
      setPt();
    }
  }
}

document.getElementById("btnPrev").onclick=prevStep;
document.getElementById("btnNext").onclick=nextStep;
window.addEventListener("resize",()=>{if(S.step>=3)afterRender();});
render();
</script>
</body>
